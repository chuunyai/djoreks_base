<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Глубокий многослойный фон -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140724" />
      <stop offset="50%" stop-color="#280E47" />
      <stop offset="100%" stop-color="#19082E" />
    </linearGradient>

    <!-- Центральное аметистовое свечение -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9B4DE0" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#5B238C" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#140724" stop-opacity="0" />
    </radialGradient>

    <!-- Градиенты для граней кристаллов -->
    <linearGradient id="crystal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C6FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8A3FFC" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="crystal-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B86BFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4A1A70" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="crystal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B238C" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1F0836" stop-opacity="0.4" />
    </linearGradient>

    <!-- Градиент текста -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F3D6FF" />
      <stop offset="100%" stop-color="#C98BFF" />
    </linearGradient>

    <!-- Мягкое свечение для звезд и текста -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Изящная 4-конечная звезда-блик -->
    <path id="star" d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#FFFFFF" filter="url(#soft-glow)" />

    <!-- Маленький пиксельный ромбик-искра -->
    <polygon id="spark" points="0,-4 4,0 0,4 -4,0" fill="#F5D0FF" filter="url(#soft-glow)" />

    <!-- Скругленная маска, чтобы кристаллы не вылезали за рамки -->
    <clipPath id="card-clip">
      <rect width="1200" height="220" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Базовый темный фон и центральный свет -->
    <rect width="1200" height="220" fill="url(#bg-grad)" />
    <rect width="1200" height="220" fill="url(#center-glow)" />

    <!-- Тонкая декоративная сетка на фоне -->
    <g stroke="#B86BFF" stroke-opacity="0.06" stroke-width="1">
      <line x1="0" y1="55" x2="1200" y2="55" />
      <line x1="0" y1="165" x2="1200" y2="165" />
      <line x1="220" y1="0" x2="220" y2="220" />
      <line x1="980" y1="0" x2="980" y2="220" />
    </g>

    <!-- ЛЕВАЯ АМЕТИСТОВАЯ ДРУЗА (Кристаллы) -->
    <g opacity="0.9">
      <!-- Задний темный кристалл -->
      <polygon points="-20,220 45,75 110,220" fill="url(#crystal-dark)" />
      <polygon points="45,75 75,110 110,220" fill="#18052B" opacity="0.5" />
      <!-- Основной большой кристалл -->
      <polygon points="20,220 95,45 165,220" fill="url(#crystal-mid)" />
      <polygon points="20,220 95,45 95,220" fill="url(#crystal-light)" opacity="0.55" />
      <line x1="95" y1="45" x2="95" y2="220" stroke="#F7D9FF" stroke-width="1" stroke-opacity="0.6" />
      <!-- Малый передний кристалл -->
      <polygon points="105,220 155,115 210,220" fill="url(#crystal-light)" opacity="0.7" />
      <polygon points="155,115 180,145 210,220" fill="#361059" opacity="0.6" />
    </g>

    <!-- ПРАВАЯ АМЕТИСТОВАЯ ДРУЗА (Кристаллы) -->
    <g opacity="0.9">
      <!-- Задний кристалл -->
      <polygon points="1080,0 1155,145 1220,0" fill="url(#crystal-dark)" />
      <!-- Основной кристалл сверху справа -->
      <polygon points="1020,0 1105,165 1185,0" fill="url(#crystal-mid)" />
      <polygon points="1020,0 1105,165 1105,0" fill="url(#crystal-light)" opacity="0.5" />
      <line x1="1105" y1="0" x2="1105" y2="165" stroke="#F7D9FF" stroke-width="1" stroke-opacity="0.6" />
      <!-- Малый нижний осколок -->
      <polygon points="990,220 1050,125 1110,220" fill="url(#crystal-light)" opacity="0.45" />
    </g>

    <!-- АНИМИРОВАННЫЕ ЗВЕЗДЫ-БЛЕСТКИ (плавное мерцание + легкий поворот) -->
    <g>
      <use href="#star" x="175" y="65">
        <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" begin="0s" />
        <animateTransform attributeName="transform" type="scale" values="0.6;1.15;0.6" dur="2.8s" repeatCount="indefinite" additive="sum" />
      </use>
      <use href="#star" x="260" y="155">
        <animate attributeName="opacity" values="0;0.85;0" dur="3.5s" repeatCount="indefinite" begin="1.1s" />
      </use>
      <use href="#star" x="390" y="42">
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite" begin="0.5s" />
      </use>
      <use href="#star" x="820" y="48">
        <animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite" begin="0.8s" />
      </use>
      <use href="#star" x="955" y="150">
        <animate attributeName="opacity" values="0;0.95;0" dur="2.6s" repeatCount="indefinite" begin="1.7s" />
      </use>
      <use href="#star" x="1035" y="75">
        <animate attributeName="opacity" values="0;0.8;0" dur="3.3s" repeatCount="indefinite" begin="0.3s" />
      </use>
    </g>

    <!-- ПАРЯЩИЕ МАГИЧЕСКИЕ ИСКРЫ (поднимаются снизу вверх) -->
    <g>
      <use href="#spark" x="230" y="190">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="12 -140" dur="4.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" repeatCount="indefinite" />
      </use>
      <use href="#spark" x="480" y="200">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-10 -150" dur="5.2s" repeatCount="indefinite" begin="1.5s" />
        <animate attributeName="opacity" values="0;0.7;0" dur="5.2s" repeatCount="indefinite" begin="1.5s" />
      </use>
      <use href="#spark" x="730" y="195">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="15 -145" dur="4.8s" repeatCount="indefinite" begin="0.8s" />
        <animate attributeName="opacity" values="0;0.85;0" dur="4.8s" repeatCount="indefinite" begin="0.8s" />
      </use>
      <use href="#spark" x="920" y="185">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-14 -135" dur="4.2s" repeatCount="indefinite" begin="2.2s" />
        <animate attributeName="opacity" values="0;0.9;0" dur="4.2s" repeatCount="indefinite" begin="2.2s" />
      </use>
    </g>

    <!-- ЦЕНТРАЛЬНАЯ КОМПОЗИЦИЯ (Текст) -->
    <g text-anchor="middle" font-family="'Minecraft Rus', 'Minecraft', 'Monocraft', 'Press Start 2P', 'Silkscreen', 'Consolas', monospace" shape-rendering="crispEdges">
      <!-- Декоративная линия сверху -->
      <line x1="460" y1="62" x2="740" y2="62" stroke="#D98BFF" stroke-width="1" stroke-opacity="0.35" />
      <polygon points="600,58 604,62 600,66 596,62" fill="#E6A8FF" />

      <!-- Главный заголовок с мягким неоновым свечением -->
      <text x="600" y="114" font-weight="800" font-size="52" letter-spacing="10" fill="url(#text-grad)" filter="url(#text-glow)">
        djoreks_base
      </text>

      <!-- Подзаголовок -->
      <text x="600" y="150" font-family="monospace, sans-serif" font-weight="600" font-size="13" letter-spacing="4" fill="#D59BF6" opacity="0.9">
        ограниченный доступ | могать всех
      </text>

      <!-- Декоративная линия снизу -->
      <line x1="510" y1="170" x2="690" y2="170" stroke="#D98BFF" stroke-width="1" stroke-opacity="0.25" />
    </g>

    <!-- Тонкая внутренняя светящаяся рамка по периметру баннера -->
    <rect x="1" y="1" width="1198" height="218" rx="15" fill="none" stroke="#C77DFF" stroke-width="1.5" stroke-opacity="0.35" />
  </g>
</svg>
